name: Cancellation watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      OPEN_DAYS: ${{ vars.OPEN_DAYS || 'Mon' }}
      WATCH_DAYS: ${{ vars.WATCH_DAYS || 'Mon' }}
      EVENING_BM_DAYS: ${{ vars.EVENING_BM_DAYS }}
      EVENING_ANY_DAYS: ${{ vars.EVENING_ANY_DAYS }}
      EVENING_BM_HOUR: ${{ vars.EVENING_BM_HOUR || '17' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The cache remembers which openings were already sent.
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python scanner.py watch
      - uses: actions/cache/save@v4
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: state-${{ github.run_id }}
